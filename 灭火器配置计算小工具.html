<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>灭火器配置计算工具（GB50140-2005）</title>
    <style>
        :root {
            --primary-color: #1976d2;
            --secondary-color: #f5f5f5;
            --accent-color: #ff9800;
            --text-color: #333;
            --border-radius: 8px;
            --box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: var(--text-color);
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        h3 {
            color: var(--primary-color);
            margin-top: 30px;
            margin-bottom: 20px;
        }

        h4 {
            color: var(--primary-color);
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .form-group {
            margin: 20px 0;
            padding: 15px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
        }

        label {
            display: inline-block;
            width: 200px;
            font-weight: bold;
        }

        input[type="number"], select {
            width: 200px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            margin-bottom: 30px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1565c0;
        }

        .result {
            background-color: var(--secondary-color);
            padding: 25px;
            margin-top: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: left;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e9e9e9;
        }

        .special-label {
            margin-right: 15px;
            display: inline-block;
        }

        .special-label input[type="checkbox"] {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>建筑灭火器配置计算工具</h2>
        
        <!-- 输入区域 -->
        <div class="form-group">
            <label>火灾种类：</label>
            <select id="fireType">
                <option value="A">A类火灾（固体）</option>
                <option value="B">B类火灾（液体）</option>
                <option value="E">E类火灾（带电）</option>
            </select>
        </div>

        <div class="form-group">
            <label>保护面积S（㎡）：</label>
            <input type="number" id="area" min="1" value="100">
        </div>

        <div class="form-group">
            <label>危险等级：</label>
            <select id="riskLevel">
                <option value="0">轻危险级</option>
                <option value="1">中危险级</option>
                <option value="2">严重危险级</option>
            </select>
        </div>

        <div class="form-group">
            <label>现场条件：</label>
            <select id="siteCondition">
                <option value="1.0">未设消防设施</option>
                <option value="0.9">仅设消火栓系统</option>
                <option value="0.7">仅设灭火系统</option>
                <option value="0.5">同时设消火栓+灭火系统</option>
                <option value="0.3">露天堆场/储罐区</option>
            </select>
        </div>

        <div class="form-group">
            <label>特殊场所：</label>
            <div class="special-label">
                <label><input type="checkbox" class="special"> 歌舞娱乐放映游艺场所</label>
            </div>
            <div class="special-label">
                <label><input type="checkbox" class="special"> 网吧</label>
            </div>
            <div class="special-label">
                <label><input type="checkbox" class="special"> 商场</label>
            </div>
            <div class="special-label">
                <label><input type="checkbox" class="special"> 寺庙</label>
            </div>
            <div class="special-label">
                <label><input type="checkbox" class="special"> 地下场所</label>
            </div>
        </div>

        <button onclick="calculate()">开始计算</button>

        <!-- 结果展示 -->
        <div class="result" id="result">
            <h3>计算结果</h3>
            <table>
                <tr><td>单具灭火器最小配置灭火级别</td><td id="singleExtinguisherLevel"></td></tr>
                <tr><td>单位灭火级别最大保护面积U</td><td id="U"></td></tr>
                <tr><td>修正系数K</td><td id="K"></td></tr>
                <tr><td>是否采用加强系数</td><td id="enhance"></td></tr>
                <tr><td>计算单元最小需配灭火级别Q</td><td id="Q"></td></tr>
                <tr><td>手提灭火器最大保护距离</td><td id="handDistance"></td></tr>
                <tr><td>推车灭火器最大保护距离</td><td id="cartDistance"></td></tr>
            </table>

            <h4>推荐配置方案</h4>
            <table>
                <thead>
                    <tr>
                        <th>类型</th>
                        <th>规格型号</th>
                        <th>灭火级别</th>
                        <th>单具最小配置灭火级别</th>
                        <th>最小数量</th>
                    </tr>
                </thead>
                <tbody id="configBody"></tbody>
            </table>
        </div>
    </div>

<script>
// 作者：Jaycn
// 最新参数配置表
const configData = {
    A: {
        minLevel: [1, 2, 3],  // A类单具灭火器最小配置灭火级别（轻/中/严重）
        U: [100, 75, 50],    // A类单位灭火级别最大保护面积（轻/中/严重）
        distance: {
            hand: [25, 20, 15],  // 手提式（轻/中/严重）
            cart: [50, 40, 30]   // 推车式
        }
    },
    B: {
        minLevel: [21, 55, 89],  // B类单具灭火器最小配置灭火级别（轻/中/严重）
        U: [1.5, 1.0, 0.5],    // B类单位灭火级别最大保护面积（轻/中/严重）
        distance: {
            hand: [15, 12, 9],   // 手提式（轻/中/严重）
            cart: [30, 24, 18]   // 推车式
        }
    },
    E: {
        minLevel: [1, 2, 3],  // E类单具灭火器最小配置灭火级别（轻/中/严重）
        U: [100, 75, 50],    // E类单位灭火级别最大保护面积（轻/中/严重）
        distance: {
            hand: [25, 20, 15],  // 手提式（轻/中/严重）
            cart: [50, 40, 30]   // 推车式
        }
    }
};

// 附件中的灭火器配置标准
const extinguisherStandard = [
    {fireType: "A", type: "水基型灭火器", model: "MS/ABEF6", level: 2},
    {fireType: "A", type: "干粉灭火器", model: "MF/ABCE3", level: 2},
    {fireType: "A", type: "干粉灭火器", model: "MF/ABCE4", level: 2},
    {fireType: "A", type: "干粉灭火器", model: "MF/ABCE5", level: 3},
    {fireType: "B", type: "干粉灭火器", model: "MF/ABCE4", level: 55},
    {fireType: "B", type: "二氧化碳灭火器", model: "MT/BE5", level: 34},
    {fireType: "B", type: "二氧化碳灭火器", model: "MT/BE7", level: 55},
    {fireType: "E", type: "二氧化碳灭火器", model: "MT/BE5", level: 34},
    {fireType: "E", type: "二氧化碳灭火器", model: "MT/BE7", level: 55},
    {fireType: "E", type: "干粉灭火器", model: "MF/ABCE4", level: 2}
];

function calculate() {
    // 获取输入值
    const fireType = document.getElementById("fireType").value;
    const area = parseFloat(document.getElementById("area").value);
    const riskLevel = parseInt(document.getElementById("riskLevel").value);
    const K = parseFloat(document.getElementById("siteCondition").value);
    
    // 处理特殊场所
    const specials = document.querySelectorAll(".special:checked");
    let enhance = 1;
    
    specials.forEach(checkbox => {
        const label = checkbox.parentElement.parentElement.textContent.trim();
        if(label.includes("歌舞娱乐放映游艺场所") || label.includes("网吧") || 
           label.includes("商场") || label.includes("寺庙") || label.includes("地下场所")) {
            enhance = 1.3;
        }
    });

    // 获取配置基准
    const U = configData[fireType].U[riskLevel];
    const minLevel = configData[fireType].minLevel[riskLevel];
    
    // 计算Q值（考虑加强系数）
    let Q = K * enhance * (area / U);
    
    // 对Q值进行进位处理
    Q = Math.ceil(Q);

    // 获取保护距离
    const handDistance = configData[fireType].distance.hand[riskLevel];
    const cartDistance = configData[fireType].distance.cart[riskLevel];

    // 显示结果
    document.getElementById("U").textContent = `${U}${fireType === "B" ? "㎡/B" : "㎡/A"}`;
    document.getElementById("K").textContent = K;
    document.getElementById("enhance").textContent = enhance > 1 ? `是（1.3）` : "否";
    document.getElementById("Q").textContent = `${Q}${fireType === "B" ? "B" : "A"}`;
    document.getElementById("handDistance").textContent = `${handDistance} 米`;
    document.getElementById("cartDistance").textContent = `${cartDistance} 米`;
    document.getElementById("singleExtinguisherLevel").textContent = 
        fireType === "B" ? `${minLevel}B` : `${minLevel}A`;

    // 生成配置方案
    let tbody = document.getElementById("configBody");
    tbody.innerHTML = "";
    const validExtinguishers = extinguisherStandard.filter(e => e.fireType === fireType && e.level >= minLevel);
    
    validExtinguishers.forEach(e => {
        const count = Math.ceil(Q / e.level);
        tbody.innerHTML += `
            <tr>
                <td>${e.type}</td>
                <td>${e.model}</td>
                <td>${e.level}${fireType === "B" ? "B" : "A"}</td>
                <td>${minLevel}${fireType === "B" ? "B" : "A"}</td>
                <td>${count} 具</td>
            </tr>`;
    });

    document.getElementById("result").style.display = "block";
}
</script>
</body>
</html>
